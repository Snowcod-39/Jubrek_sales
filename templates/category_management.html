<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category Management - RUBREK ENTERPRISES</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* ================= HEADER ================= */

        header {
            background: #0b63ce;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        header h1 {
            margin: 0;
            font-size: 21px;
            letter-spacing: 0.5px;
        }

        header div {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
        }

        header a:hover {
            background: white;
            color: #0b63ce;
        }

        /* ================= MAIN ================= */

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 25px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h2 {
            margin: 0;
            font-size: 25px;
            color: #172033;
        }

        .dashboard-btn {
            text-decoration: none;
            background: white;
            color: #0b63ce;
            border: 1px solid #d5deeb;
            padding: 9px 15px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .dashboard-btn:hover {
            background: #eef5ff;
        }

        /* ================= CARDS ================= */

        .card {
            background: white;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 25px;
            border: 1px solid #e1e7ef;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
        }

        .card h3 {
            margin: 0 0 18px;
            font-size: 18px;
            color: #172033;
        }

        /* ================= FORM ================= */

        #category-form {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 250px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #4b5563;
        }

        .form-group input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0b63ce;
            box-shadow: 0 0 0 2px rgba(11, 99, 206, 0.1);
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .add-btn {
            background: #0b63ce;
            color: white;
            padding: 11px 20px;
            border-radius: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .add-btn:hover {
            background: #084f9f;
        }

        /* ================= MESSAGE ================= */

        #message {
            margin: 15px 0 0;
            font-size: 14px;
            font-weight: bold;
        }

        /* ================= CATEGORY GRID ================= */

        #category-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .category-card {
            border: 1px solid #e0e6ef;
            border-radius: 9px;
            padding: 17px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: 0.2s ease;
        }

        .category-card:hover {
            border-color: #b8cde7;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .category-info {
            min-width: 0;
        }

        .category-name {
            margin: 0 0 7px;
            font-size: 15px;
            font-weight: bold;
            color: #172033;
            word-break: break-word;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-active {
            background: #e7f7ee;
            color: #167442;
        }

        .status-inactive {
            background: #f1f3f5;
            color: #6b7280;
        }

        .status-btn {
            padding: 7px 11px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .deactivate-btn {
            background: #fff1f1;
            color: #c62828;
        }

        .deactivate-btn:hover {
            background: #ffe1e1;
        }

        .reactivate-btn {
            background: #eaf3ff;
            color: #0b63ce;
        }

        .reactivate-btn:hover {
            background: #dbeaff;
        }

        /* ================= EMPTY / LOADING ================= */

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 35px;
            color: #6b7280;
            background: white;
            border: 1px dashed #cfd8e3;
            border-radius: 9px;
        }

        /* ================= LOADING OVERLAY ================= */

        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader-content {
            text-align: center;
            color: #0b63ce;
            font-weight: bold;
        }

        .biscuit {
            font-size: 42px;
            display: inline-block;
            animation: biscuitSpin 1s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes biscuitSpin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            header {
                padding: 15px 18px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            header div {
                width: 100%;
                justify-content: space-between;
            }

            main {
                margin: 25px auto;
                padding: 0 15px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            #category-form {
                display: block;
            }

            .form-group {
                margin-bottom: 12px;
            }

            .add-btn {
                width: 100%;
            }

            #category-list {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

    <!-- ================= LOADING ================= -->

    <div id="loadingOverlay">
        <div class="loader-content">
            <div class="biscuit">🍪</div>
            <div>Loading...</div>
        </div>
    </div>


    <!-- ================= HEADER ================= -->

    <header>

        <h1>RUBREK ENTERPRISES</h1>

        <div>
            <span>Welcome, {{ session["full_name"] }}</span>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>
        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <div class="page-header">

            <h2>Category Management</h2>

            <a
                href="{{ url_for('admin_dashboard') }}"
                class="dashboard-btn"
            >
                ← Dashboard
            </a>

        </div>


        <!-- ================= ADD CATEGORY ================= -->

        <section class="card">

            <h3>Add New Category</h3>

            <form id="category-form">

                <div class="form-group">

                    <label for="category_name">
                        Category Name
                    </label>

                    <input
                        type="text"
                        id="category_name"
                        name="category_name"
                        placeholder="e.g. Beverages"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="add-btn"
                >
                    + Add Category
                </button>

            </form>

            <p id="message"></p>

        </section>


        <!-- ================= CATEGORIES ================= -->

        <section class="card">

            <h3>Categories</h3>

            <div id="category-list">

                <div class="empty-state">
                    Loading categories...
                </div>

            </div>

        </section>

    </main>


    <script>

        // ============================================
        // LOADING OVERLAY
        // ============================================

        function showLoading() {
            document.getElementById("loadingOverlay").style.display = "flex";
        }

        function hideLoading() {
            document.getElementById("loadingOverlay").style.display = "none";
        }


        // ============================================
        // LOAD CATEGORIES
        // ============================================

        async function loadCategories() {

            const categoryList =
                document.getElementById("category-list");

            try {

                const response =
                    await fetch("/api/categories");

                const data =
                    await response.json();

                if (!response.ok) {

                    categoryList.innerHTML = `
                        <div class="empty-state">
                            ${data.error || "Could not load categories."}
                        </div>
                    `;

                    return;
                }

                if (data.categories.length === 0) {

                    categoryList.innerHTML = `
                        <div class="empty-state">
                            No categories found.
                        </div>
                    `;

                    return;
                }

                categoryList.innerHTML = "";

                data.categories.forEach(category => {

                    const categoryDiv =
                        document.createElement("div");

                    categoryDiv.className = "category-card";

                    let actionButton = "";

                    if (category.status === "ACTIVE") {

                        actionButton = `
                            <button
                                class="status-btn deactivate-btn"
                                onclick="changeCategoryStatus(${category.id}, 'deactivate')"
                            >
                                Deactivate
                            </button>
                        `;

                    } else {

                        actionButton = `
                            <button
                                class="status-btn reactivate-btn"
                                onclick="changeCategoryStatus(${category.id}, 'reactivate')"
                            >
                                Reactivate
                            </button>
                        `;

                    }

                    const statusClass =
                        category.status === "ACTIVE"
                            ? "status-active"
                            : "status-inactive";

                    categoryDiv.innerHTML = `

                        <div class="category-info">

                            <p class="category-name">
                                ${category.category_name}
                            </p>

                            <span class="status-badge ${statusClass}">
                                ${category.status}
                            </span>

                        </div>

                        ${actionButton}

                    `;

                    categoryList.appendChild(categoryDiv);

                });

            } catch (error) {

                categoryList.innerHTML = `
                    <div class="empty-state">
                        Could not connect to the server.
                    </div>
                `;

            }

        }


        // ============================================
        // ADD CATEGORY
        // ============================================

        document.getElementById("category-form").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const categoryName =
                    document.getElementById("category_name")
                    .value
                    .trim();

                const message =
                    document.getElementById("message");

                if (!categoryName) {

                    message.textContent =
                        "Category name is required.";

                    return;
                }

                try {

                    const response =
                        await fetch("/api/categories", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                category_name: categoryName
                            })

                        });

                    const data =
                        await response.json();

                    if (!response.ok) {

                        message.textContent =
                            data.error ||
                            "Could not create category.";

                        return;
                    }

                    message.textContent =
                        data.message;

                    document.getElementById(
                        "category-form"
                    ).reset();

                    loadCategories();

                } catch (error) {

                    message.textContent =
                        "Could not connect to the server.";

                }

            }
        );


        // ============================================
        // CHANGE CATEGORY STATUS
        // ============================================

        async function changeCategoryStatus(categoryId, action) {

            try {

                const response =
                    await fetch(
                        `/api/categories/${categoryId}/${action}`,
                        {
                            method: "PATCH"
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok) {

                    document.getElementById("message").textContent =
                        data.error ||
                        "Could not change category status.";

                    return;
                }

                document.getElementById("message").textContent =
                    data.message;

                loadCategories();

            } catch (error) {

                document.getElementById("message").textContent =
                    "Could not connect to the server.";

            }

        }


        // ============================================
        // INITIAL LOAD
        // ============================================

        loadCategories();

    </script>

</body>

</html>
