<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Orders - JUBREK ENTERPRISES</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        :root {
            --charcoal: #202421;
            --charcoal-dark: #171a18;
            --charcoal-light: #292d2a;

            --card-grey: #d9dcda;
            --card-grey-dark: #c7ccca;

            --tiffany-blue: #81d8d0;

            --action-blue: #1769aa;
            --action-blue-dark: #125582;

            --primary-text: #202421;
            --secondary-text: #737A75;

            --white: #ffffff;

            --border-light: rgba(32, 36, 33, 0.13);
            --border-dark: rgba(255, 255, 255, 0.10);

            --success: #247a4d;
            --success-bg: #d9eee1;

            --danger: #b42318;
            --danger-bg: #f5d8d8;

            --warning: #765500;
            --warning-bg: #fff0c7;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            background: var(--charcoal);

            color: var(--primary-text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {
            background: var(--charcoal-dark);

            color: var(--white);

            min-height: 72px;

            padding: 0 35px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid var(--border-dark);
        }


        header h1 {
            margin: 0;

            font-size: 22px;

            font-weight: 800;

            letter-spacing: 0.6px;
        }


        header > div {
            display: flex;

            align-items: center;

            gap: 22px;
        }


        header span {
            font-size: 14px;

            font-weight: 500;

            color: #e5e8e6;
        }


        header a {
            color: var(--white);

            text-decoration: none;

            padding: 9px 16px;

            border:
                1px solid
                rgba(255, 255, 255, 0.35);

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;

            transition: 0.2s ease;
        }


        header a:hover {
            background: var(--tiffany-blue);

            color: var(--charcoal);

            border-color: var(--tiffany-blue);
        }


        /* =========================================================
           MAIN HEADER
        ========================================================= */

        main {
            width: min(1180px, 94%);

            margin: 32px auto 50px;
        }


        .orders-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 28px;

            gap: 20px;
        }


        .orders-header h2 {
            color: var(--white);

            margin: 0;

            font-size: 28px;
        }


        .header-actions {
            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }


        /* =========================================================
           ACTION BUTTONS
        ========================================================= */

        .orders-header button,
        .dashboard-btn {
            white-space: nowrap;

            background: var(--action-blue);

            color: var(--white);

            border: none;

            padding: 10px 16px;

            border-radius: 7px;

            font-weight: 600;

            font-size: 14px;

            cursor: pointer;

            text-decoration: none;

            transition: 0.2s ease;
        }


        .orders-header button:hover,
        .dashboard-btn:hover {
            background: var(--tiffany-blue);

            color: var(--charcoal);
        }


        .dashboard-btn {
            display: inline-flex;

            align-items: center;

            gap: 6px;
        }


        /* =========================================================
           PAGE MESSAGE
        ========================================================= */

        #pageMessage {
            color: var(--secondary-text);

            font-size: 13px;
        }


        /* =========================================================
           SECTIONS
        ========================================================= */

        .orders-section {
            margin-bottom: 35px;
        }


        .orders-section > h2 {
            color: var(--white);

            font-size: 19px;

            margin:
                0 0 15px;
        }


        .orders-list {
            display: grid;

            gap: 15px;
        }


        /* =========================================================
           ORDER CARD
        ========================================================= */

        .order-card {
            background: var(--card-grey);

            border:
                1px solid
                var(--border-light);

            border-left:
                5px solid
                var(--action-blue);

            border-radius: 10px;

            padding: 20px;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.16);

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        /*
            Individual order cards hover Tiffany.
            The surrounding section does not.
        */

        .order-card:hover {
            background: var(--tiffany-blue);

            border-color: var(--tiffany-blue);

            transform: translateY(-2px);

            box-shadow:
                0 9px 25px
                rgba(0, 0, 0, 0.22);
        }


        /* =========================================================
           ORDER CARD HEADER
        ========================================================= */

        .order-card-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 15px;
        }


        .order-card-header h3 {
            margin: 0;

            color: var(--primary-text);

            font-size: 18px;
        }


        /* =========================================================
           STATUS BADGES
        ========================================================= */

        .order-status {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;
        }


        .status-pending {
            background: var(--warning-bg);

            color: var(--warning);
        }


        .status-processing {
            background: #d4e5f3;

            color: var(--action-blue-dark);
        }


        .status-paid {
            background: var(--success-bg);

            color: #24633f;
        }


        .status-released {
            background: #d3e8e6;

            color: #236965;
        }


        .status-cancelled,
        .status-rejected {
            background: var(--danger-bg);

            color: var(--danger);
        }


        /* =========================================================
           ORDER INFORMATION
        ========================================================= */

        .order-info {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 8px 25px;

            margin-bottom: 15px;
        }


        .order-info p {
            margin: 5px 0;

            color: var(--secondary-text);

            font-size: 13px;
        }


        .order-info strong {
            color: var(--primary-text);
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .order-actions {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }


        .order-actions button {
            cursor: pointer;

            border: none;

            border-radius: 7px;

            padding: 9px 14px;

            font-weight: 600;

            background: var(--action-blue);

            color: var(--white);

            transition: 0.2s ease;
        }


        .order-actions button:hover {
            background: var(--tiffany-blue);

            color: var(--charcoal);
        }


        /* =========================================================
           ORDER DETAILS
        ========================================================= */

        .order-details {
            margin-top: 20px;

            padding-top: 20px;

            border-top:
                1px solid
                rgba(32, 36, 33, 0.15);
        }


        .order-details h4 {
            margin-top: 0;

            color: var(--primary-text);
        }


        /* =========================================================
           ORDER ITEMS
        ========================================================= */

        .order-item {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 10px 0;

            border-bottom:
                1px solid
                rgba(32, 36, 33, 0.10);
        }


        .order-item:last-child {
            border-bottom: none;
        }


        .order-item small {
            color: var(--secondary-text);
        }


        /* =========================================================
           TOTAL
        ========================================================= */

        .detail-total {
            display: flex;

            justify-content: space-between;

            margin-top: 15px;

            padding-top: 15px;

            border-top:
                2px solid
                rgba(32, 36, 33, 0.16);

            font-size: 18px;

            font-weight: 700;

            color: var(--primary-text);
        }


        /* =========================================================
           ACTION AREA
        ========================================================= */

        .action-area {
            margin-top: 15px;

            padding: 15px;

            background: var(--card-grey-dark);

            border:
                1px solid
                rgba(32, 36, 33, 0.12);

            border-radius: 8px;
        }


        .action-area h4 {
            margin-top: 0;

            margin-bottom: 12px;

            color: var(--primary-text);
        }


        .action-area p {
            color: var(--secondary-text);

            font-size: 13px;
        }


        .action-area select {
            padding: 10px;

            border:
                1px solid
                rgba(32, 36, 33, 0.20);

            border-radius: 6px;

            margin-right: 10px;

            background: var(--white);

            color: var(--primary-text);
        }


        .action-area button {
            background: var(--action-blue);

            color: var(--white);

            border: none;

            padding: 9px 14px;

            border-radius: 7px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .action-area button:hover {
            background: var(--tiffany-blue);

            color: var(--charcoal);
        }


        /* =========================================================
           RECEIPT
        ========================================================= */

        .receipt-box {
            margin-top: 15px;

            padding: 15px;

            background: var(--card-grey-dark);

            border:
                1px solid
                rgba(32, 36, 33, 0.12);

            border-radius: 8px;
        }


        .receipt-box h4 {
            margin-bottom: 10px;

            color: var(--primary-text);
        }


        .receipt-box p {
            margin: 6px 0;

            color: var(--secondary-text);
        }


        .receipt-box strong {
            color: var(--primary-text);
        }


        /* =========================================================
           SUCCESS / RELEASE MESSAGES
        ========================================================= */

        .paid-message {
            margin-top: 15px;

            padding: 12px;

            background: var(--success-bg);

            color: #24633f;

            border-left:
                4px solid
                var(--success);

            border-radius: 6px;
        }


        .paid-message p,
        .released-message p {
            color: inherit;
        }


        .released-message {
            margin-top: 15px;

            padding: 12px;

            background: #d3e8e6;

            color: #236965;

            border-left:
                4px solid
                #3b8f89;

            border-radius: 6px;
        }


        /* =========================================================
           GENERAL MESSAGE
        ========================================================= */

        .message {
            margin: 15px 0;

            padding: 10px;

            border-radius: 5px;
        }


        /* =========================================================
           EMPTY STATE
        ========================================================= */

        .no-orders {
            background: var(--card-grey);

            border:
                1px solid
                var(--border-light);

            border-radius: 9px;

            padding: 20px;

            color: var(--secondary-text);

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.12);
        }


        .no-orders p {
            margin: 0;
        }


        /* =========================================================
           LOADING
        ========================================================= */

        .loading {
            color: var(--secondary-text);

            background: var(--card-grey);

            border-radius: 8px;

            padding: 14px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            header {
                padding: 15px 18px;

                flex-direction: column;

                align-items: flex-start;

                gap: 12px;
            }


            header > div {
                width: 100%;

                justify-content: space-between;
            }


            header h1 {
                font-size: 19px;
            }


            main {
                width: 92%;

                margin-top: 25px;
            }


            .orders-header {
                flex-direction: column;

                align-items: flex-start;
            }


            .header-actions {
                width: 100%;
            }


            .dashboard-btn,
            .orders-header button {
                flex: 1;

                text-align: center;

                justify-content: center;
            }


            .order-info {
                grid-template-columns: 1fr;
            }


            .order-card-header {
                flex-direction: column;

                align-items: flex-start;
            }


            .order-item {
                flex-direction: column;

                gap: 5px;
            }


            .action-area select {
                margin-bottom: 10px;

                margin-right: 0;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>JUBREK ENTERPRISES</h1>

    <div>

        <span>
            Welcome, {{ session["full_name"] }}
        </span>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</header>


<main>


    <div class="orders-header">

        <h2>
            Customer Orders
        </h2>


        <div class="header-actions">


            <!-- BACK TO DASHBOARD -->

            <a
                href="/employee/dashboard"
                class="dashboard-btn"
            >
                ← Dashboard
            </a>


            <!-- REFRESH -->

            <button
                type="button"
                onclick="loadOrders()"
            >
                Refresh Orders
            </button>


        </div>

    </div>


    <p id="pageMessage"></p>


    <!-- =====================================================
         NEW CUSTOMER ORDERS
    ====================================================== -->

    <section class="orders-section">

        <h2>
            New Orders
        </h2>


        <div
            id="pendingOrders"
            class="orders-list"
        >

            <p class="loading">
                Loading orders...
            </p>

        </div>

    </section>


    <!-- =====================================================
         MY / ACTIVE ORDERS
    ====================================================== -->

    <section class="orders-section">

        <h2>
            My Orders
        </h2>


        <div
            id="myOrders"
            class="orders-list"
        >

            <p class="loading">
                Loading orders...
            </p>

        </div>

    </section>


</main>


<script>


/* =========================================================
   LOAD ALL ORDERS
========================================================= */

async function loadOrders() {

    await Promise.all([
        loadPendingOrders(),
        loadMyOrders()
    ]);

}


/* =========================================================
   LOAD PENDING ORDERS
========================================================= */

async function loadPendingOrders() {

    const container =
        document.getElementById("pendingOrders");

    try {

        const response =
            await fetch("/api/orders/pending");

        const data =
            await response.json();


        if (!response.ok) {

            container.innerHTML = `
                <div class="no-orders">
                    <p>
                        ${data.error || "Could not load pending orders."}
                    </p>
                </div>
            `;

            return;
        }


        const orders =
            data.orders || [];


        if (orders.length === 0) {

            container.innerHTML = `
                <div class="no-orders">
                    <p>
                        No new customer orders.
                    </p>
                </div>
            `;

            return;
        }


        container.innerHTML =
            orders
                .map(order => createPendingOrderCard(order))
                .join("");


    } catch (error) {

        console.error(
            "Pending orders error:",
            error
        );


        container.innerHTML = `
            <div class="no-orders">
                <p>
                    Could not load pending orders.
                </p>
            </div>
        `;
    }
}


/* =========================================================
   CREATE PENDING ORDER CARD
========================================================= */

function createPendingOrderCard(order) {

    return `

        <div class="order-card"
             id="pending-order-${order.id}">

            <div class="order-card-header">

                <h3>
                    Order #${order.id}
                </h3>

                <span class="order-status status-pending">
                    PENDING
                </span>

            </div>


            <div class="order-info">

                <p>
                    <strong>Customer:</strong>
                    ${order.customer_name}
                </p>

                <p>
                    <strong>Contact:</strong>
                    ${order.customer_contact || "N/A"}
                </p>

                <p>
                    <strong>Total:</strong>
                    KSh ${formatMoney(order.total_amount)}
                </p>

                <p>
                    <strong>Placed:</strong>
                    ${formatDate(order.created_at)}
                </p>

            </div>


            <div class="order-actions">

                <button
                    type="button"
                    onclick="viewOrder(${order.id}, 'pending')">

                    View Order

                </button>


                <button
                    type="button"
                    onclick="acceptOrder(${order.id})">

                    Accept Order

                </button>


                <button
                    type="button"
                    onclick="rejectOrder(${order.id})">

                    Reject Order

                </button>

            </div>


            <div
                id="details-pending-${order.id}"
                class="order-details"
                style="display:none;">
            </div>

        </div>

    `;
}


/* =========================================================
   LOAD MY ORDERS
========================================================= */

async function loadMyOrders() {

    const container =
        document.getElementById("myOrders");

    try {

        const response =
            await fetch("/api/orders/my-orders");

        const data =
            await response.json();


        if (!response.ok) {

            container.innerHTML = `
                <div class="no-orders">
                    <p>
                        ${data.error || "Could not load your orders."}
                    </p>
                </div>
            `;

            return;
        }


        const orders =
            data.orders || [];


        if (orders.length === 0) {

            container.innerHTML = `
                <div class="no-orders">
                    <p>
                        You have not processed any orders yet.
                    </p>
                </div>
            `;

            return;
        }


        container.innerHTML =
            orders
                .map(order => createMyOrderCard(order))
                .join("");


    } catch (error) {

        console.error(
            "My orders error:",
            error
        );


        container.innerHTML = `
            <div class="no-orders">
                <p>
                    Could not load your orders.
                </p>
            </div>
        `;
    }
}


/* =========================================================
   CREATE MY ORDER CARD
========================================================= */

function createMyOrderCard(order) {

    const status =
        order.status || "UNKNOWN";


    const statusClass =
        "status-" + status.toLowerCase();


    return `

        <div class="order-card"
             id="my-order-${order.id}">

            <div class="order-card-header">

                <h3>
                    Order #${order.id}
                </h3>

                <span class="order-status ${statusClass}">
                    ${status}
                </span>

            </div>


            <div class="order-info">

                <p>
                    <strong>Customer:</strong>
                    ${order.customer_name}
                </p>

                <p>
                    <strong>Contact:</strong>
                    ${order.customer_contact || "N/A"}
                </p>

                <p>
                    <strong>Total:</strong>
                    KSh ${formatMoney(order.total_amount)}
                </p>

                <p>
                    <strong>Last Updated:</strong>
                    ${formatDate(order.updated_at)}
                </p>

            </div>


            <div class="order-actions">

                <button
                    type="button"
                    onclick="viewOrder(${order.id}, 'my')">

                    View Order

                </button>


                ${
                    status === "PROCESSING"

                    ?

                    `
                    <button
                        type="button"
                        onclick="showPaymentArea(${order.id})">

                        Receive Payment

                    </button>

                    <button
                        type="button"
                        onclick="cancelOrder(${order.id})">

                        Cancel Order

                    </button>
                    `

                    :

                    ""
                }


                ${
                    status === "PAID"

                    ?

                    `
                    <button
                        type="button"
                        onclick="releaseSale(${order.id})">

                        Release Sale

                    </button>
                    `

                    :

                    ""
                }

            </div>


            <div
                id="payment-area-${order.id}"
                class="action-area"
                style="display:none;">

                <h4>
                    Receive Payment
                </h4>

                <p>
                    Select the payment method used by the customer.
                </p>

                <select id="payment-${order.id}">

                    <option value="CASH">
                        CASH
                    </option>

                    <option value="MPESA">
                        MPESA
                    </option>

                </select>


                <button
                    type="button"
                    onclick="payOrder(${order.id})">

                    Confirm Payment

                </button>

            </div>


            <div
                id="details-my-${order.id}"
                class="order-details"
                style="display:none;">
            </div>

        </div>

    `;
}


/* =========================================================
   VIEW FULL ORDER
========================================================= */

async function viewOrder(orderId, source) {

    const detailsId =
        source === "pending"
        ? `details-pending-${orderId}`
        : `details-my-${orderId}`;


    const details =
        document.getElementById(detailsId);


    if (!details) {
        return;
    }


    if (details.style.display === "block") {

        details.style.display = "none";

        return;
    }


    details.style.display = "block";

    details.innerHTML =
        "<p>Loading order details...</p>";


    try {

        const response =
            await fetch(
                `/api/orders/${orderId}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            details.innerHTML = `
                <p>
                    ${data.error || "Could not load order."}
                </p>
            `;

            return;
        }


        const order =
            data.order;


        details.innerHTML =
            buildOrderDetails(order);


    } catch (error) {

        console.error(
            "View order error:",
            error
        );


        details.innerHTML =
            "<p>Could not load order details.</p>";
    }
}


/* =========================================================
   BUILD ORDER DETAILS
========================================================= */

function buildOrderDetails(order) {

    const items =
        order.items || [];


    let html = `

        <h4>
            Order Items
        </h4>

    `;


    if (items.length === 0) {

        html += `
            <p>
                No items found.
            </p>
        `;

    } else {

        html += items.map(item => {

            return `

                <div class="order-item">

                    <span>

                        <strong>
                            ${item.product_name}
                        </strong>

                        × ${item.quantity}

                        <br>

                        <small>
                            KSh ${formatMoney(item.unit_price)}
                            each
                        </small>

                    </span>


                    <strong>
                        KSh ${formatMoney(item.subtotal)}
                    </strong>

                </div>

            `;

        }).join("");
    }


    html += `

        <div class="detail-total">

            <strong>
                Total
            </strong>

            <strong>
                KSh ${formatMoney(order.total_amount)}
            </strong>

        </div>

    `;


    /* PAYMENT / RECEIPT INFORMATION */

    if (
        order.receipt_number !== undefined &&
        order.receipt_number !== null
    ) {

        html += `

            <div class="receipt-box">

                <h4>
                    Payment / Receipt
                </h4>

                <p>
                    <strong>Receipt Number:</strong>
                    ${order.receipt_number}
                </p>


                ${
                    order.payment_method

                    ?

                    `
                    <p>
                        <strong>Payment Method:</strong>
                        ${order.payment_method}
                    </p>
                    `

                    :

                    ""
                }


                ${
                    order.payment_status

                    ?

                    `
                    <p>
                        <strong>Payment Status:</strong>
                        ${order.payment_status}
                    </p>
                    `

                    :

                    ""
                }

            </div>

        `;
    }


    /* PROCESSING */

    if (order.status === "PROCESSING") {

        html += `

            <div class="action-area">

                <h4>
                    Receive Payment
                </h4>

                <p>
                    Select the customer's payment method.
                </p>


                <select
                    id="details-payment-${order.id}">

                    <option value="CASH">
                        CASH
                    </option>

                    <option value="MPESA">
                        MPESA
                    </option>

                </select>


                <button
                    type="button"
                    onclick="payOrderFromDetails(${order.id})">

                    Confirm Payment

                </button>

            </div>

        `;
    }


    /* PAID */

    if (order.status === "PAID") {

        html += `

            <div class="paid-message">

                <strong>
                    Payment received.
                </strong>

                <p>
                    The sale is paid and ready to be released.
                </p>

            </div>


            <div class="action-area">

                <h4>
                    Release Sale
                </h4>

                <p>
                    Confirm that the goods are being handed over
                    to the customer.
                </p>


                <button
                    type="button"
                    onclick="releaseSale(${order.id})">

                    Release Sale

                </button>

            </div>

        `;
    }


    /* RELEASED */

    if (order.status === "RELEASED") {

        html += `

            <div class="released-message">

                <strong>
                    Sale Released
                </strong>

                <p>
                    Payment was received and the goods have
                    been released to the customer.
                </p>

            </div>

        `;
    }


    return html;
}


/* =========================================================
   ACCEPT ORDER
========================================================= */

async function acceptOrder(orderId) {

    const confirmed =
        confirm(
            `Accept Order #${orderId} and move it to PROCESSING?`
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/orders/${orderId}/process`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Could not accept order."
            );

            return;
        }


        alert(
            `Order #${orderId} has been accepted.`
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "Accept order error:",
            error
        );


        alert(
            "Could not accept order."
        );
    }
}


/* =========================================================
   SHOW PAYMENT AREA
========================================================= */

function showPaymentArea(orderId) {

    const area =
        document.getElementById(
            `payment-area-${orderId}`
        );


    if (!area) {
        return;
    }


    if (area.style.display === "block") {

        area.style.display = "none";

    } else {

        area.style.display = "block";

    }
}


/* =========================================================

========================================================= */

async function payOrder(orderId) {

    const paymentSelect =
        document.getElementById(

/* =========================================================
   SUBMIT PAYMENT
========================================================= */

async function submitPayment(
    orderId,
    paymentMethod
) {

    try {

        const response =
            await fetch(
                `/api/orders/${orderId}/pay`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        payment_method:
                            paymentMethod
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Could not receive payment."
            );

            return;
        }


        alert(
            `Payment received successfully.\n\n` +
            `Order #${orderId}\n` +
            `Receipt Number: ${data.receipt_number}\n` +
            `Payment Method: ${data.payment_method}\n` +
            `Amount: KSh ${formatMoney(data.total_amount)}\n\n` +
            `The sale is now PAID and ready for release.`
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "Payment error:",
            error
        );


        alert(
            "Could not receive payment."
        );
    }
}

/* =========================================================
   CHANGE ORDER STATUS
========================================================= */

async function changeOrderStatus(
    orderId,
    status
) {

    try {

        const response =
            await fetch(
                `/api/orders/${orderId}/status`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status: status
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Could not update order."
            );

            return;
        }


        alert(
            `Order #${orderId} is now ${data.status}.`
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "Change order status error:",
            error
        );


        alert(
            "Could not update order."
        );
    }
}


/* =========================================================
   FORMAT MONEY
========================================================= */

function formatMoney(value) {

    const number =
        Number(value || 0);


    return number.toLocaleString(
        "en-KE",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(dateString) {

    if (!dateString) {
        return "N/A";
    }


    const date =
        new Date(dateString);


    if (isNaN(date.getTime())) {
        return dateString;
    }


    return date.toLocaleString();
}
