<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        JUBREK ENTERPRISES - Receipt
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .receipt {
            width: 380px;
            margin: auto;
            background: white;
            padding: 25px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.25;
        }

        .header h3 {
            margin: 7px 0;
            font-size: 14px;
            font-weight: normal;
        }

        .header p {
            margin: 8px 0;
            font-size: 15px;
            font-weight: bold;
        }

        .receipt-info {
            font-size: 14px;
            margin-bottom: 15px;
        }

        .receipt-info div {
            margin-bottom: 7px;
        }

        .receipt-info strong {
            display: inline-block;
            min-width: 95px;
        }

        .customer-name {
            font-weight: bold;
        }

        .notes-section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
            font-size: 13px;
        }

        .notes-label {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .notes-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .items {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .items th,
        .items td {
            padding: 8px 4px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 13px;
        }

        .items th {
            font-size: 12px;
        }

        .items th:last-child,
        .items td:last-child {
            text-align: right;
        }

        .totals {
            margin-top: 18px;
            border-top: 1px solid #222;
            padding-top: 10px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            font-size: 14px;
        }

        .total-row.main-total {
            font-size: 18px;
            font-weight: bold;
            margin-top: 8px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
        }

        .footer p {
            margin: 6px 0;
        }

        .print-button {
            display: block;
            width: 380px;
            margin: 20px auto;
            padding: 12px;
            border: none;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .print-button:hover {
            background: #444;
        }

        @media print {

            body {
                background: white;
                padding: 0;
            }

            .receipt {
                width: 100%;
                box-shadow: none;
                padding: 10px;
            }

            .print-button {
                display: none;
            }

        }

    </style>

</head>


<body>

    <div class="receipt">

        <div class="header">

            <h1>
                JUBREK ENTERPRISES
            </h1>

            <h3>
                0722 477 300
                <br>
                0783 611 304
            </h3>

            <p>
                Sales Receipt
            </p>

        </div>


        <div class="receipt-info">

            <div>
                <strong>Receipt No:</strong>
                <span id="receiptNumber"></span>
            </div>

            <div>
                <strong>Date:</strong>
                <span id="saleDate"></span>
            </div>

            <div>
                <strong>Served By:</strong>
                <span id="employeeName"></span>
            </div>

            <div>
                <strong>Customer:</strong>
                <span
                    id="customerName"
                    class="customer-name"
                >
                    -
                </span>
            </div>

            <div>
                <strong>Payment:</strong>
                <span id="paymentMethod"></span>
            </div>

        </div>


        <div
            id="notesSection"
            class="notes-section"
            style="display:none;"
        >

            <div class="notes-label">
                Notes:
            </div>

            <div
                id="notesText"
                class="notes-text"
            ></div>

        </div>


        <table class="items">

            <thead>

                <tr>

                    <th>
                        Product
                    </th>

                    <th>
                        Qty
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Amount
                    </th>

                </tr>

            </thead>

            <tbody id="itemsBody">
            </tbody>

        </table>


        <div class="totals">

            <div class="total-row main-total">

                <span>
                    Total:
                </span>

                <span>
                    KSh
                    <span id="totalAmount">
                        0.00
                    </span>
                </span>

            </div>


            <div
                id="amountReceivedRow"
                class="total-row"
                style="display:none;"
            >

                <span>
                    Amount Received:
                </span>

                <span>
                    KSh
                    <span id="amountReceived">
                        0.00
                    </span>
                </span>

            </div>
            
        </div>


        <div class="footer">

            <p>
                Goods once sold are not re-accepted!!!
            </p>

            <p>
                Thank you for your business.
            </p>

        </div>

    </div>


    <button
        class="print-button"
        onclick="window.print()"
    >
        Print Receipt
    </button>


    <script>

        const saleId =
            new URLSearchParams(
                window.location.search
            ).get("sale_id");


        function formatMoney(value) {

            const number =
                Number(value || 0);

            return number.toLocaleString(
                "en-KE",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

        }


        function formatDate(value) {

            if (!value) {
                return "-";
            }

            const date =
                new Date(value);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return value;
            }

            return date.toLocaleString(
                "en-KE",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

        }


        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        async function loadReceipt() {

            if (!saleId) {

                alert(
                    "No sale specified."
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/sales/${saleId}/receipt`
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.error ||
                        "Could not load receipt."
                    );

                    return;

                }


                document.getElementById(
                    "receiptNumber"
                ).textContent =
                    data.receipt_number;


                document.getElementById(
                    "saleDate"
                ).textContent =
                    formatDate(
                        data.sale_date
                    );


                document.getElementById(
                    "employeeName"
                ).textContent =
                    data.employee_name || "-";


                document.getElementById(
                    "paymentMethod"
                ).textContent =
                    String(
                        data.payment_method ||
                        ""
                    ).toUpperCase() === "MPESA"
                        ? "M-Pesa"
                        : "Cash";


                /* =========================================
                   CUSTOMER NAME
                ========================================= */

                document.getElementById(
                    "customerName"
                ).textContent =
                    data.customer_name
                        ? data.customer_name
                        : "-";


                /* =========================================
                   NOTES
                ========================================= */

                const notesSection =
                    document.getElementById(
                        "notesSection"
                    );

                const notesText =
                    document.getElementById(
                        "notesText"
                    );


                if (data.notes) {

                    notesText.textContent =
                        data.notes;

                    notesSection.style.display =
                        "block";

                } else {

                    notesText.textContent = "";

                    notesSection.style.display =
                        "none";

                }


                /* =========================================
                   TOTAL
                ========================================= */

                document.getElementById(
                    "totalAmount"
                ).textContent =
                    formatMoney(
                        data.total_amount
                    );
            
                /* =========================================
                   ITEMS
                ========================================= */

                const itemsBody =
                    document.getElementById(
                        "itemsBody"
                    );

                itemsBody.innerHTML = "";


                data.items.forEach(
                    item => {

                        const row =
                            document.createElement(
                                "tr"
                            );


                        row.innerHTML = `

                            <td>
                                ${escapeHtml(
                                    item.product_name
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    item.quantity
                                )}
                            </td>

                            <td>
                                ${formatMoney(
                                    item.selling_price
                                )}
                            </td>

                            <td>
                                ${formatMoney(
                                    item.subtotal
                                )}
                            </td>

                        `;


                        itemsBody.appendChild(
                            row
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "RECEIPT LOAD ERROR:",
                    error
                );

                alert(
                    "Could not load receipt."
                );

            }

        }


        loadReceipt();

    </script>

</body>

</html>
